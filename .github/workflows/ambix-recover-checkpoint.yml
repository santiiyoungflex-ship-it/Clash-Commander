name: AmbiX recover checkpoint and finish Android package

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID that contains ambix-arena-training-checkpoint
        required: true
        type: string
  push:
    branches:
      - ambix-from-zero
    paths:
      - .github/workflows/ambix-recover-checkpoint.yml

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
      AMBIX_HUD_EPOCHS: "40"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ambix-from-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AmbiX/training/requirements.txt
      - name: Install pinned CPU PyTorch and export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AmbiX/training/requirements.txt
          # Re-pin PyTorch AFTER Ultralytics and export dependencies so pip cannot
          # replace the known-compatible CPU build during dependency resolution.
          pip install --force-reinstall --no-deps torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, torchvision, onnxscript; print('Pinned export stack:', torch.__version__, torchvision.__version__, onnxscript.__version__); assert torch.__version__.startswith('2.5.1')";
      - name: Download arena checkpoint from completed training run
        uses: actions/download-artifact@v4
        with:
          name: ambix-arena-training-checkpoint
          path: runs/ambix-checkpoints
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '43633735245' }}
      - name: Export recovered arena checkpoint without retraining
        run: python AmbiX/training/export_clash_checkpoint.py
      - name: Preserve exported arena model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambix-recovered-arena-tflite
          path: |
            AmbiX/app/src/main/assets/ambix_model.tflite
            AmbiX/app/src/main/assets/labels.txt
            AmbiX/app/src/main/assets/model_metadata.json
          if-no-files-found: warn
          retention-days: 30
      - name: Train auxiliary HUD, elixir and hand-card model
        run: python AmbiX/training/train_hud_model.py
      - name: Preserve HUD checkpoint even if export fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambix-hud-training-checkpoint
          path: runs/ambix-checkpoints/hud_best.pt
          if-no-files-found: warn
          retention-days: 30
      - name: Verify both on-device model packages
        run: |
          test -s AmbiX/app/src/main/assets/ambix_model.tflite
          test -s AmbiX/app/src/main/assets/labels.txt
          test -s AmbiX/app/src/main/assets/model_metadata.json
          test -s AmbiX/app/src/main/assets/ambix_hud.tflite
          test -s AmbiX/app/src/main/assets/hud_labels.txt
          test -s AmbiX/app/src/main/assets/hud_model_metadata.json
      - name: Commit trained on-device models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AmbiX/app/src/main/assets/ambix_model.tflite AmbiX/app/src/main/assets/labels.txt AmbiX/app/src/main/assets/model_metadata.json AmbiX/app/src/main/assets/ambix_hud.tflite AmbiX/app/src/main/assets/hud_labels.txt AmbiX/app/src/main/assets/hud_model_metadata.json
          git commit -m "Add recovered AmbiX arena and HUD models"
          git push origin HEAD:ambix-from-zero
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android vision regression tests
        run: gradle -p AmbiX :app:testDebugUnitTest --stacktrace
      - name: Build APK with recovered arena and HUD models
        run: gradle -p AmbiX :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ambix-debug-apk-with-recovered-models
          path: AmbiX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
