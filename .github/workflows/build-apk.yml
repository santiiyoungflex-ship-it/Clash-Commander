name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-touch-autopilot-toggle

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: android-touch-autopilot-toggle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare API configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> local.properties
          printf 'ANTHROPIC_API_KEY=\nROBOFLOW_API_KEY=\n' >> local.properties

      - name: Download speech model assets
        run: bash scripts/bootstrap_sherpa_deps.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-commander-touch-autopilot
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
