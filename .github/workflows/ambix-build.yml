name: AmbiX Android build
on:
  push:
    branches: [ambix-from-zero]
    paths: ['AmbiX/**','.github/workflows/ambix-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run vision regression tests
        run: gradle -p AmbiX :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle -p AmbiX :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ambix-debug-apk
          path: AmbiX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
