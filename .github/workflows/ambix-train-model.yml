name: AmbiX train local vision model

on:
  push:
    branches:
      - ambix-from-zero
    paths:
      - "AmbiX/training/train_clash_model.py"
      - "AmbiX/training/train_hud_model.py"
      - "AmbiX/training/requirements.txt"
      - ".github/workflows/ambix-train-model.yml"
  workflow_dispatch:
    inputs:
      epochs:
        description: Arena model training epochs (1-120)
        required: true
        default: "30"
        type: string

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
      AMBIX_EPOCHS: ${{ inputs.epochs || '30' }}
      AMBIX_HUD_EPOCHS: "40"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ambix-from-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AmbiX/training/requirements.txt
      - name: Install pinned CPU PyTorch for legacy TFLite export
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned training and TensorFlow export dependencies
        run: pip install -r AmbiX/training/requirements.txt
      - name: Train YOLO11n and export float32 TFLite
        run: python AmbiX/training/train_clash_model.py
      - name: Train HUD, elixir and hand-card model
        run: python AmbiX/training/train_hud_model.py
      - name: Verify generated model assets
        run: |
          test -s AmbiX/app/src/main/assets/ambix_model.tflite
          test -s AmbiX/app/src/main/assets/labels.txt
          test -s AmbiX/app/src/main/assets/model_metadata.json
          test -s AmbiX/app/src/main/assets/ambix_hud.tflite
          test -s AmbiX/app/src/main/assets/hud_labels.txt
          test -s AmbiX/app/src/main/assets/hud_model_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          assets = Path("AmbiX/app/src/main/assets")
          metadata = json.loads((assets / "model_metadata.json").read_text())
          hud = json.loads((assets / "hud_model_metadata.json").read_text())
          arena_labels = [x for x in (assets / "labels.txt").read_text().splitlines() if x.strip()]
          hud_labels = [x for x in (assets / "hud_labels.txt").read_text().splitlines() if x.strip()]
          assert metadata["labels_count"] == len(arena_labels), (metadata["labels_count"], len(arena_labels))
          assert hud["labels_count"] == len(hud_labels), (hud["labels_count"], len(hud_labels))
          assert len(set(arena_labels)) == len(arena_labels), "Duplicate arena labels"
          assert len(set(hud_labels)) == len(hud_labels), "Duplicate HUD labels"
          assert metadata["tflite_input"] == "float32 [1,320,320,3]"
          assert hud["tflite_input"] == "float32 [1,320,320,3]"
          assert (assets / "ambix_model.tflite").stat().st_size > 100_000
          assert (assets / "ambix_hud.tflite").stat().st_size > 100_000
          print(json.dumps({"arena": metadata, "hud": hud}, indent=2))
          PY
      - name: Commit trained on-device model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AmbiX/app/src/main/assets/ambix_model.tflite AmbiX/app/src/main/assets/labels.txt AmbiX/app/src/main/assets/model_metadata.json AmbiX/app/src/main/assets/ambix_hud.tflite AmbiX/app/src/main/assets/hud_labels.txt AmbiX/app/src/main/assets/hud_model_metadata.json
          git commit -m "Add trained AmbiX Clash Royale TFLite model"
          git push origin HEAD:ambix-from-zero
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android vision regression tests
        run: gradle -p AmbiX :app:testDebugUnitTest --stacktrace
      - name: Build APK with trained model
        run: gradle -p AmbiX :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ambix-debug-apk-with-trained-model
          path: AmbiX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ambix-trained-tflite-model
          path: |
            AmbiX/app/src/main/assets/ambix_model.tflite
            AmbiX/app/src/main/assets/labels.txt
            AmbiX/app/src/main/assets/model_metadata.json
            AmbiX/app/src/main/assets/ambix_hud.tflite
            AmbiX/app/src/main/assets/hud_labels.txt
            AmbiX/app/src/main/assets/hud_model_metadata.json
