name: AmbiX train local vision model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs (1-120)
        required: true
        default: "80"
        type: string

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
      AMBIX_EPOCHS: ${{ inputs.epochs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ambix-from-zero
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AmbiX/training/requirements.txt
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && pip install -r AmbiX/training/requirements.txt
      - name: Train YOLO11n and export float32 TFLite
        run: python AmbiX/training/train_clash_model.py
      - name: Verify generated model assets
        run: |
          test -s AmbiX/app/src/main/assets/ambix_model.tflite
          test -s AmbiX/app/src/main/assets/labels.txt
          test -s AmbiX/app/src/main/assets/model_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("AmbiX/app/src/main/assets/model_metadata.json").read_text())
          assert metadata["labels_count"] == 145
          assert metadata["tflite_input"] == "float32 [1,320,320,3]"
          print(json.dumps(metadata, indent=2))
          PY
      - name: Commit trained on-device model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AmbiX/app/src/main/assets/ambix_model.tflite AmbiX/app/src/main/assets/labels.txt AmbiX/app/src/main/assets/model_metadata.json
          git commit -m "Add trained AmbiX Clash Royale TFLite model"
          git push origin HEAD:ambiX-from-zero
      - uses: actions/upload-artifact@v4
        with:
          name: ambix-trained-tflite-model
          path: |
            AmbiX/app/src/main/assets/ambix_model.tflite
            AmbiX/app/src/main/assets/labels.txt
            AmbiX/app/src/main/assets/model_metadata.json
